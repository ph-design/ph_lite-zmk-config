# USB + BLE baseline, with locked ZMKs Studio (USB transport is selected in build.yaml).
CONFIG_ZMK_DEVICE_MANUFACTURER="Team PHDesign"
CONFIG_ZMK_DEVICE_MODEL="OT60"
CONFIG_ZMK_DEVICE_FAMILY="OT60"
CONFIG_USB_DEVICE_PRODUCT="OT60"
CONFIG_USB_DEVICE_PID=0xF003
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_POINTING=y

# Eight WS2812 LEDs, RGB1 -> RGB8. SPI2 leaves I2C0/I2C1 available.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_EXPERIMENTAL_RGB_LAYER=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=75
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=5
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8192
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=2
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6
CONFIG_ZMK_IDLE_TIMEOUT=120000
CONFIG_ZMK_IDLE_SKIP_ON_USB_POWER=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=360
CONFIG_ZMK_UNRESPONSE_FIX=y


# User confirmed U5 is the same LIS2DH12 as EVO; reuse its existing driver.
CONFIG_SENSOR=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=50
CONFIG_ZMK_LIS2DH_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_MOTION=y
CONFIG_ZMK_MOTION_IMU_FLIP_Z=y

# Only U7 on I2C1 is used for keypress haptics.
CONFIG_HAPTICS=y
CONFIG_HAPTICS_DRV2605=y
CONFIG_OT60_HAPTICS=y
