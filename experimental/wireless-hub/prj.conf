CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
# Many BLE HID mice implement legacy Just Works pairing, not LE SC.
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_HOGP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_DEVICE_NAME="EIO Wireless Hub"
CONFIG_ESB=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_MPSL_TIMESLOT=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_HWINFO=y
CONFIG_PWM=y
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_BT_GATT_DM_MAX_ATTRS=96
CONFIG_BT_HOGP_REPORTS_MAX=24
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# CDC callbacks must not share a queue with BLE lifecycle/flash work.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_NRF_THREAD_STACK_SIZE=1024
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1536
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_REBOOT=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_ESB_PIPE_COUNT=2
CONFIG_ESB_TX_FIFO_SIZE=4
