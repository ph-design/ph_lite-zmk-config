# EVO 2.4G build override, based on the upstream Multi V2 PTX configuration.
# Keep the standard EVO shield configuration, keymap, RGB and IMU enabled.
CONFIG_SRAM_VECTOR_TABLE=y
CONFIG_ZMK_2G4=y
CONFIG_ZMK_2G4_RF_CHANNEL=76
CONFIG_ZMK_2G4_TX_POWER=8
CONFIG_ZMK_2G4_RETRANSMIT_COUNT=4
CONFIG_ZMK_2G4_RETRANSMIT_DELAY=500
CONFIG_ZMK_2G4_AES_KEY="6D6164656279706864656973676EC0DE"
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y

# Keep Studio's normal unlocking requirement for pairing and keymap changes.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# Refresh keyboard battery estimate once per minute.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=16384

CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=64
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LIS2DH_BLOCK_DATA_UPDATE=y
