manifest:
  defaults:
    revision: v0.3-lts
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware/
    - name: phdesign
      url-base: https://github.com/ph-design/
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: phdesign
      revision: v0.3-lts
      import: app/west.yml
    # zmk-studio-messages is provided by zmk's own app/west.yml
    # (ph-design/zmk-studio-messages @ v0.3_lts) - do not override it here.
  self:
    path: config
