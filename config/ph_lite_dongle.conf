# ZMK app identity and transports.
CONFIG_ZMK_KEYBOARD_NAME="PH Lite Dongle"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n

# 2.4G receiver role.
CONFIG_ZMK_2G4_DONGLE=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_2G4_AES_KEY="6D6164656279706864656973676EC0DE"
CONFIG_ZMK_SLEEP=n

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Local USB CDC ACM management commands.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PH_LITE_DONGLE_AT_CMD=y

# Enter the existing Adafruit UF2 bootloader from the app image.
CONFIG_PH_LITE_DONGLE_AT_BOOTLOADER=y

# App USB identity.
CONFIG_USB_DEVICE_VID=0x5048
CONFIG_USB_DEVICE_PID=0xFF11
CONFIG_USB_DEVICE_MANUFACTURER="Team PHDesign"
CONFIG_USB_DEVICE_PRODUCT="PH Lite Dongle"
